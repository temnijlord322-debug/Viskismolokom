name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # позволяет запускать сборку вручную из вкладки Actions

env:
  SOURCE: main.cpp     # <-- имя твоего .cpp файла
  OUTPUT: app.exe      # <-- как назвать готовый .exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        run: cl /EHsc /O2 /std:c++17 /Fe:${{ env.OUTPUT }} ${{ env.SOURCE }}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT }}
          path: ${{ env.OUTPUT }}
